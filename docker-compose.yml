services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gst_fraud_backend
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_PORT=8000
      - API_HOST=0.0.0.0
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gst_fraud_frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    restart: unless-stopped
